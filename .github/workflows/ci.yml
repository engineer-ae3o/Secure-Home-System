name: CI

on: [push, pull_request]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21

      - name: Check Formatting
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' | xargs clang-format-21 --style=file --dry-run --Werror

  build-debug-tests:
    name: Build (debug-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain
        run: |
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
          echo "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure
        run: cmake --preset debug-tests

      - name: Build
        run: cmake --build --preset debug-tests

  build-debug:
    name: Build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain
        run: |
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
          echo "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain
        run: |
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
          echo "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain & Cppcheck
        run: |
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo apt-key add -
          echo "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi cppcheck

      - name: Configure Presets
        run: cmake --preset debug-tests

      - name: Run Cppcheck Target
        run: cmake --build --preset debug-tests --target cppcheck
